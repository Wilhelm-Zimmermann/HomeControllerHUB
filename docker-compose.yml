services:
  home-controller-hub-postgres:
    container_name: home-controller-hub-postgres
    image: postgres
    environment:
      - POSTGRES_PASSWORD=local-dev-postgres-password
      - POSTGRES_USER=user_home-controller-hub
      - POSTGRES_DB=db_home-controller-hub
    ports:
      - 15432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - home-controller-hub-network

  home-controller-hub-rabbitmq:
    container_name: home-controller-hub-rabbitmq
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - home-controller-hub-network

